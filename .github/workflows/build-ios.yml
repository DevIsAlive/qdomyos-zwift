name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'ios'
          modules: 'qtcharts qtnetworkauth'

      - name: Build with Qt Make
        run: |
          mkdir build-ios
          cd build-ios
          qmake ../qdomyos-zwift.pro -spec macx-ios-clang CONFIG+=release
          make -j$(sysctl -n hw.ncpu)

      - name: Package into IPA
        run: |
          mkdir Payload
          find ./build-ios -type d -name "*.app" -exec cp -R {} Payload/ \;
          zip -r qdomyos-zwift.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdomyos-zwift-ios
          path: qdomyos-zwift.ipa
