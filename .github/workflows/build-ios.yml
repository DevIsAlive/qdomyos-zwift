name: iOS Unsigned Build (For Sideloadly)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout smtpclient submodule
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout googletest submodule
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: "tst/googletest/"
          ref: "release-1.12.1"

      - name: Rename lib TARGET to match the Xcode scheme
        run: sed -i '' 's/TARGET = qdomyos-zwift/TARGET = qdomyoszwift/g' src/qdomyos-zwift-lib.pro

      - name: Strip the maintainer's own hardcoded signing team
        run: |
          sed -i '' 's/QMAKE_DEVELOPMENT_TEAM = 6335M7T29D/# QMAKE_DEVELOPMENT_TEAM disabled for CI/' qdomyos-zwift.pro src/qdomyos-zwift.pro
          sed -i '' 's/QMAKE_CODE_SIGN_IDENTITY = "iPhone Developer"/# QMAKE_CODE_SIGN_IDENTITY disabled for CI/' qdomyos-zwift.pro src/qdomyos-zwift.pro
          sed -i '' 's/QMAKE_CODE_SIGN_STYLE = Automatic/# QMAKE_CODE_SIGN_STYLE disabled for CI/' qdomyos-zwift.pro src/qdomyos-zwift.pro

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'ios'
          modules: 'qtcharts qtnetworkauth'
          dir: '${{ github.workspace }}/output/ios/'
          cache: 'true'

      - name: Fix Qt's ios.conf (ios-simulator -> iphonesimulator)
        run: find ${{ github.workspace }}/output/ios/ -name 'ios.conf' -exec sed -i '' 's/ios-simulator/iphonesimulator/g' {} \;

      - name: Fix Qt's devices.py (python -> python3)
        run: find ${{ github.workspace }}/output/ios/ -name 'devices.py' -exec sed -i '' 's/\/usr\/bin\/python/\/usr\/bin\/python3/g' {} \;

      - name: Apply the maintainer's prebuilt Bluetooth patch
        run: cp qt-patches/ios/5.15.2/binary/*.* ${{ github.workspace }}/output/ios/Qt/5.15.2/ios/lib/

      - name: Create build folder
        run: mkdir build-ios

      - name: qmake (device, release)
        working-directory: build-ios
        run: qmake ../qdomyos-zwift.pro -spec macx-ios-clang CONFIG+=release CONFIG+=device CONFIG-=simulator

      - name: Build
        working-directory: build-ios
        run: make -j4 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        working-directory: build-ios
        run: |
          mkdir -p Payload
          find . -type d -name "qdomyoszwift.app" -exec cp -R {} Payload/ \;
          zip -qr qdomyoszwift-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdomyoszwift-ios-unsigned
          path: build-ios/qdomyoszwift-unsigned.ipa
