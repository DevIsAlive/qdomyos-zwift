name: iOS Unsigned Build (For Sideloadly/LiveContainer)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Strip the maintainer's hardcoded signing team
        run: |
          sed -i '' 's/QMAKE_DEVELOPMENT_TEAM = 6335M7T29D/# QMAKE_DEVELOPMENT_TEAM disabled for CI/' qdomyos-zwift.pro
          sed -i '' 's/QMAKE_CODE_SIGN_IDENTITY = "iPhone Developer"/# QMAKE_CODE_SIGN_IDENTITY disabled for CI/' qdomyos-zwift.pro
          sed -i '' 's/QMAKE_CODE_SIGN_STYLE = Automatic/# QMAKE_CODE_SIGN_STYLE disabled for CI/' qdomyos-zwift.pro

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          target: 'ios'
          modules: 'qtnetworkauth qtcharts'
          dir: '${{ github.workspace }}/output/ios/'

      - name: Apply the maintainer's real Bluetooth patch
        run: cp qt-patches/ios/5.15.2/binary/*.* ${{ github.workspace }}/output/ios/Qt/5.15.2/ios/lib/

      # --- Strava secret fix ---
      # STRAVA_SECRET_KEY is ONLY ever read from src/secret.h (via __has_include).
      # If that file doesn't exist, homeform.h unconditionally redefines it to the
      # placeholder word "test", silently overriding any -D flag passed via qmake.
      # Do NOT quote the value here -- STRINGIFY() in the source adds the quotes itself.
      - name: Write Strava secret header
        working-directory: src
        run: echo "#define STRAVA_SECRET_KEY ${{ secrets.STRAVA_CLIENT_SECRET }}" > secret.h
      # --- end Strava secret fix ---

      # --- qthttpserver / in-app WebView fix ---
      # Needed so qtHaveModule(httpserver) is true, which is what makes the .pri
      # file add QT += webview for iOS. Without this the in-app Strava login
      # WebView silently fails to load and the app falls back to external Safari,
      # which can't reliably complete the 127.0.0.1 loopback OAuth callback.
      - name: Prep qthttpserver 3rd-party headers
        run: cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/

      - name: Cache qthttpserver build (iOS)
        id: cache-qthttpserver-ios
        uses: actions/cache@v4
        with:
          path: src/qthttpserver
          key: qthttpserver-ios-${{ runner.os }}-qt5.15.2-v1

      - name: Build qthttpserver for iOS
        if: steps.cache-qthttpserver-ios.outputs.cache-hit != 'true'
        working-directory: src/qthttpserver
        run: |
          qmake -spec macx-ios-clang CONFIG+=release CONFIG+=device CONFIG-=simulator
          make -j4

      - name: Install qthttpserver for iOS
        working-directory: src/qthttpserver
        run: make install
      # --- end qthttpserver fix ---

      - name: Create Build Folder
        run: mkdir build-ios

      - name: Run qmake (Inject Custom Strava Client ID)
        working-directory: build-ios
        run: >
          qmake ../qdomyos-zwift.pro -spec macx-ios-clang CONFIG+=release CONFIG+=device CONFIG-=simulator
          "DEFINES+=STRAVA_CLIENT_ID=\\\"${{ secrets.STRAVA_CLIENT_ID }}\\\""

      - name: Pre-create Generated Source Stubs
        working-directory: build-ios
        run: |
          mkdir -p src
          touch src/qdomyoszwift_qmltyperegistrations.cpp
          touch src/qdomyoszwift_qml_plugin_import.cpp

      - name: Compile App (Bypass Apple Code Signing)
        working-directory: build-ios
        run: |
          echo "CODE_SIGNING_ALLOWED = NO" > bypass.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> bypass.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> bypass.xcconfig
          echo "CODE_SIGN_STYLE = Manual" >> bypass.xcconfig
          echo "DEVELOPMENT_TEAM = " >> bypass.xcconfig

          export XCODE_XCCONFIG_FILE="$PWD/bypass.xcconfig"

          make -j4

      - name: Package Unsigned IPA
        working-directory: build-ios
        run: |
          mkdir -p Payload
          find . -type d -name "*.app" -exec cp -R {} Payload/ \;
          zip -qr qdomyoszwift-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdomyoszwift-ios-unsigned
          path: build-ios/qdomyoszwift-unsigned.ipa
