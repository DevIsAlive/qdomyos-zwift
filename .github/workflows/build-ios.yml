name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          target: 'ios'
          modules: 'qtconnectivity qtpositioning qtnetworkauth qtwebsockets qtspeech qtlocation qtmultimedia qtcharts'

      - name: Generate Xcode Project
        run: qmake -spec macx-xcode qdomyos-zwift.pro

      - name: Build Unsigned App
        run: |
          xcodebuild build \
            -project qdomyos-zwift.xcodeproj \
            -scheme qdomyos-zwift \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir Payload
          find . -type d -name "qdomyos-zwift.app" -exec cp -R {} Payload/ \;
          zip -r qdomyos-zwift.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdomyos-zwift-ios
          path: qdomyos-zwift.ipa
