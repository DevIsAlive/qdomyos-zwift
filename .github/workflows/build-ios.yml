name: iOS Unsigned Build (For Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          target: 'ios'
          modules: 'qtnetworkauth qtcharts'

      - name: Create Build Folder
        run: mkdir build-ios

      - name: Run qmake
        working-directory: build-ios
        run: qmake ../qdomyos-zwift.pro -spec macx-ios-clang CONFIG+=release CONFIG+=device CONFIG-=simulator

      - name: Compile App (Bypass Apple Code Signing)
        working-directory: build-ios
        run: |
          echo "Starting initial compilation..."
          # This compiles the code but intentionally allows the signing step to fail (|| true prevents GitHub from stopping)
          make -j3 || true
          
          echo "Bypassing Xcode signing and generating the .app..."
          # Move into the folder where Qt generated the Xcode project
          cd src
          
          # Run xcodebuild directly, forcing it to ignore all signing certificates
          xcodebuild build -project qdomyoszwift.xcodeproj -scheme qdomyoszwift -configuration Release -arch arm64 -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        working-directory: build-ios
        run: |
          echo "Creating Payload folder..."
          mkdir -p Payload
          
          echo "Finding the compiled .app file and moving it..."
          find . -type d -name "*.app" -exec cp -R {} Payload/ \;
          
          echo "Compressing into IPA format..."
          zip -qr qdomyoszwift-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdomyoszwift-ios-unsigned
          path: build-ios/qdomyoszwift-unsigned.ipa
