name: iOS Unsigned Build (For Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          target: 'ios'
          modules: 'qtnetworkauth qtcharts'

      - name: Create Build Folder
        run: mkdir build-ios

      - name: Run qmake
        working-directory: build-ios
        run: qmake ../qdomyos-zwift.pro -spec macx-ios-clang CONFIG+=release CONFIG+=device CONFIG-=simulator

      - name: Pre-create Generated Source Stubs
        working-directory: build-ios
        run: |
          # Satisfies Xcode's static file check before build scripts execute
          touch src/qdomyoszwift_qmltyperegistrations.cpp
          touch src/qdomyoszwift_qml_plugin_import.cpp

      - name: Compile App (Bypass Apple Code Signing)
        working-directory: build-ios
        run: |
          echo "Creating Xcode override configuration..."
          echo "CODE_SIGNING_ALLOWED = NO" > bypass.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> bypass.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> bypass.xcconfig
          
          export XCODE_XCCONFIG_FILE="$PWD/bypass.xcconfig"
          
          echo "Compiling the app..."
          make -j3

      - name: Package Unsigned IPA
        working-directory: build-ios
        run: |
          echo "Creating Payload folder..."
          mkdir -p Payload
          
          echo "Finding the compiled .app file and moving it..."
          find . -type d -name "*.app" -exec cp -R {} Payload/ \;
          
          echo "Compressing into IPA format..."
          zip -qr qdomyoszwift-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdomyoszwift-ios-unsigned
          path: build-ios/qdomyoszwift-unsigned.ipa
